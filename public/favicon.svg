<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#253763"/>
      <stop offset="100%" stop-color="#1B294B"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#grad)"/>
  
  <!-- Canvas layout wireframe preview -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="#EDEFF5" stroke="#8A87F9" stroke-width="2"/>
  
  <!-- Header bar inside wireframe -->
  <rect x="16" y="16" width="32" height="6" rx="2" fill="#8A87F9"/>
  
  <!-- Left column block -->
  <rect x="16" y="26" width="10" height="20" rx="2" fill="#8A91A1"/>
  
  <!-- Right content block -->
  <rect x="29" y="26" width="19" height="12" rx="2" fill="#253763"/>
  <rect x="29" y="41" width="12" height="5" rx="2" fill="#8A87F9"/>
</svg>
